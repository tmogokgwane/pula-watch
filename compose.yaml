services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pulawatch
      POSTGRES_USER: pulawatch
      POSTGRES_PASSWORD: pulawatch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulawatch"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/pulawatch
      DB_USER: pulawatch
      DB_PASSWORD: pulawatch
    ports:
      - "8080:8080"

volumes:
  pgdata:
